[project]
name = "har-analyze"
version = "0.1.0"
description = "HAR file analyzer with deterministic performance insights"
readme = "README.md"
requires-python = ">=3.14,<3.16"

dependencies = [
    "ijson",
    "pydantic",
    "typer",
    "rich",
]

[project.scripts]
har-analyze = "har_analyze:main"

[project.optional-dependencies]
dev = [
    "ruff",
    "basedpyright",
    "pytest",
    "pytest-cov",
    "pytest-timeout",
    "pip-audit",
]

# Ruff configuration
[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PERF", "PTH", "PL", "PIE", "RUF", "Q", "D"]
ignore = [
    "D100",  # Missing module docstring
    "D104",  # Missing package docstring
]

[tool.ruff.lint.per-file-ignores]
# Tests assert hand-computed literal values and use descriptive names instead of docstrings.
"tests/**" = ["D103", "PLR2004"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# Basedpyright configuration
[tool.basedpyright]
typeCheckingMode = "strict"
reportUnknownParameterType = "error"
reportUnknownMemberType = "error"
reportUnknownVariableType = "error"
reportMissingTypeArgument = "error"
reportUnnecessaryTypeIgnoreComment = "error"
pythonVersion = "3.14"
pythonPlatform = "All"
include = ["src"]
exclude = ["**/__pycache__", "**/.venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
timeout = 30

[tool.coverage.run]
branch = true
source = ["src/har_analyze"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
